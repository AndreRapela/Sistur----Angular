<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>SisTur</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="SisTur - Sistema de turismo para Fernando de Noronha com mapas, roteiros, passeios, restaurantes, hospedagens e conveniencias reais.">
  <meta name="keywords" content="Fernando de Noronha, turismo, passeios, restaurantes, praias, hoteis, mapa, roteiro">
  <meta property="og:title" content="SisTur - Fernando de Noronha">
  <meta property="og:description" content="Explore Fernando de Noronha com mapas, roteiros e lugares reais.">
  <meta property="og:image" content="/assets/icons/icon.svg">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0077B6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#023E8A" media="(prefers-color-scheme: dark)">
  <script src="runtime-config.js"></script>

  <style>
    .marker-pin {
      width: 40px;
      height: 40px;
      border-radius: 50% 50% 50% 0;
      background: #0077B6;
      position: absolute;
      transform: rotate(-45deg);
      left: 50%;
      top: 50%;
      margin: -20px 0 0 -20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid white;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .marker-pin i {
      transform: rotate(45deg);
      color: white;
      font-size: 18px;
    }

    .pin-restaurant { background: #ef4444; }
    .pin-hotel { background: #3b82f6; }
    .pin-event { background: #f59e0b; }
    .pin-tour { background: #10b981; }

    #initial-loader {
      position: fixed;
      inset: 0;
      background: white;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.16s ease;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #f3f4f6;
      border-top-color: #0077B6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "TravelAgency",
    "name": "SisTur Fernando de Noronha",
    "description": "Sistema de turismo para Fernando de Noronha com mapas, roteiros, passeios, restaurantes, hospedagens e conveniencias reais.",
    "url": "https://sistur.gov.br",
    "image": "/assets/icons/icon.svg",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Fernando de Noronha",
      "addressRegion": "PE",
      "addressCountry": "BR"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": "-3.8407",
      "longitude": "-32.4111"
    }
  }
  </script>
</head>
<body>
  <div id="initial-loader">
    <div class="spinner"></div>
    <h2>SisTur</h2>
  </div>
  <app-root></app-root>
</body>
</html>
